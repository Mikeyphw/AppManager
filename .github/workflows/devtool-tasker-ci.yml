name: Devtool Tasker integration / hosted Android

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Hosted Gradle task group'
        required: true
        default: full
        type: choice
        options: [build, test, lint, full]
  push:
    branches: [feature/tasker-automation]
    paths:
      - '.devtool.toml'
      - 'devtoolw*'
      - 'scripts/devtool/**'
      - '.github/workflows/devtool-tasker-ci.yml'
      - 'app/src/main/java/io/github/muntashirakon/AppManager/automation/**'
      - 'app/src/test/java/io/github/muntashirakon/AppManager/automation/**'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tasker-devtool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: Devtool source contract and upstream merge safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source checks (no Gradle)
        run: |
          python3 scripts/devtool/check_contract.py --check
          python3 scripts/devtool/check_automation_contract.py --check
          python3 scripts/devtool/check_amt03_contract.py --check
          python3 -m unittest discover -s scripts/devtool -p 'test_*.py' -v
          sh -n devtoolw
      - name: Verify upstream merge compatibility without changing the tree
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/MuntashirAkon/AppManager.git
          git fetch --no-tags upstream master
          git merge-tree --write-tree HEAD upstream/master > "$RUNNER_TEMP/appmanager-upstream-merge-tree.txt"
          echo 'Upstream merge-tree calculation succeeded.'
      - name: Install exact Devtool source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Validate native Devtool configuration, wrapper, and seal
        shell: bash
        run: |
          set -euo pipefail
          devtool --repo "$PWD" config resolve > "$RUNNER_TEMP/devtool-config.json"
          devtool --repo "$PWD" wrapper verify
          devtool --repo "$PWD" wrapper seal
          ./devtoolw source-check

  hosted-android:
    name: Android Gradle through Devtool (GitHub-hosted only)
    needs: [source-contract]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'cmake;3.22.1'
      - name: Install exact Devtool source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Devtool Android action / workflow execution
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          set -euo pipefail
          : "${JAVA_HOME:?GitHub setup-java must expose JAVA_HOME}"
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app inspect
          # Lint legacy issue snapshot is pinned to run 42255012506 and is
          # checked against the *fresh* lint XML. No global lint suppression.
          # Devtool performs the Gradle work; historical upstream lint findings
          # are acknowledged only when they exactly match the frozen snapshot.
          run_guarded_devtool() {
            local mode="$1"
            shift
            local xml="app/build/reports/lint-results-debug.xml"
            local log="$RUNNER_TEMP/appmanager-devtool-${mode}.log"
            rm -f -- "$xml"
            set +e
            "$@" 2>&1 | tee "$log"
            local devtool_rc="${PIPESTATUS[0]}"
            set -e
            # Missing report or any new lint error fails closed.
            python3 scripts/devtool/check_upstream_lint_baseline.py --report "$xml" --summary "$GITHUB_STEP_SUMMARY"
            # Never waive an actual Gradle failure; the known Devtool reporting
            # failure is distinct from Gradle's successful lintDebug task.
            # Ensure lint itself (not an earlier build/test task) succeeded.
            if ! awk '
              /> Task :app:lintDebug/ { saw_lint=1; lint_ok=0 }
              saw_lint && /Gradle result: success/ { lint_ok=1 }
              END { exit !(saw_lint && lint_ok) }
            ' "$log"; then
              echo 'No successful hosted lintDebug execution; refusing legacy waiver' >&2
              return 1
            fi
            if [[ "$mode" == full ]]; then
              if ! grep -Eq 'Build[[:space:]]+Done' "$log" ||                  ! grep -Eq 'Run tests[[:space:]]+Done' "$log"; then
                echo 'Hosted build/test stage did not complete; refusing legacy waiver' >&2
                return 1
              fi
            fi
            if (( devtool_rc != 0 )); then
              echo '::warning::Devtool classified accepted upstream lint debt as failure; no new errors were found.'
            fi
          }
          case "$MODE" in
            build) devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app build ;;
            test)  devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app test ;;
            lint)  run_guarded_devtool lint devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app lint ;;
            full)  run_guarded_devtool full devtool --repo "$PWD" --java-home "$JAVA_HOME" invoke --target app ci ;;
            *)     echo "Unsupported mode: $MODE" >&2; exit 2 ;;
          esac
      - name: Produce checksum manifest of debug APKs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            find app/build/outputs/apk/debug -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > devtool-apk-sha256.txt
          fi
      - name: Upload debug APKs and integrity manifest (not release-signed)
        if: always() && (inputs.mode == 'build' || inputs.mode == 'full' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-devtool-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/**/*.apk
            devtool-apk-sha256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload hosted Android lint report and baseline audit
        if: always() && (inputs.mode == 'lint' || inputs.mode == 'full' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-lint-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7


  device-instrumentation:
    name: AMT-03 Android instrumentation via Devtool emulator
    needs: [source-contract]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install hosted Android SDK and pinned Devtool
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'cmake;3.22.1'
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Run journal device instrumentation (no real profiles modified)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash -e -o pipefail <<'AMT03_EMULATOR_BASH'
            : "${JAVA_HOME:?}"
            python3 -m devtool.android_instrumentation "$PWD" --policy required               --device-serial emulator-5554 --runner androidx.test.runner.AndroidJUnitRunner               --class io.github.muntashirakon.AppManager.automation.tasker.TaskerJournalInstrumentedTest               --report "$RUNNER_TEMP/amt03-instrumentation.json"               2>&1 | tee "$RUNNER_TEMP/amt03-instrumentation.log"
            python3 - <<'PYCHECK'
            import json, pathlib, os
            p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'amt03-instrumentation.json'
            assert p.is_file(), 'Devtool did not write Android instrumentation receipt'
            r = json.loads(p.read_text())
            assert r.get('status') in ('passed','success'), r
            assert int(r.get('passed',0)) >= 2, r
            assert int(r.get('failed',0)) == 0, r
            print('AMT03_DEVICE_INSTRUMENTATION_PASS')
            PYCHECK
            AMT03_EMULATOR_BASH
      - name: Upload instrumentation receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-amt03-instrumentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/amt03-instrumentation.json
            ${{ runner.temp }}/amt03-instrumentation.log
          if-no-files-found: warn
          retention-days: 7
